name: Build Mello

# Every push to main builds a signed APK and publishes it as a GitHub release,
# which Obtainium on the phone picks up and installs as an update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "mello-${{ github.run_number }}.apk"
          gh release create "v1.0.${{ github.run_number }}" "mello-${{ github.run_number }}.apk" \
            --title "Mello build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}"
